[project]
name = "minikv"
version = "0.1.0"
description = "A persistent key-value database built from scratch: LSM tree, WAL, Bloom filters, compaction, TCP server"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
minikv-server = "minikv.server:main"
minikv-cli = "minikv.client:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minikv"]
